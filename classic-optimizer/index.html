<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>코스인라인 아카데미 · 클래식 2.0 최적 구성</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="rise">
        <p class="eyebrow">코스인라인 아카데미 · Classic 2.0</p>
        <h1>최적 구성</h1>
        <p class="lede">
          새로 바뀐 클래식 2.0 카드와 제약으로, 이론상 점수가 높은 연기 구성을
          뽑습니다. QoE·오버타임·풋워크·예술 가정은 직접 고를 수 있습니다.
        </p>
        <div class="glow-line"></div>
      </header>

      <div class="layout">
        <aside class="panel rise delay-1" id="controls"></aside>
        <main class="panel rise delay-2" id="results">
          <div class="empty">
            <p class="empty-title">아직 결과 없음</p>
            <p>
              왼쪽에서 규정·목표·QoE·오버타임을 고른 뒤 「최적 구성 뽑기」를
              누르세요. 기술/속성 필터를 켜면 그 안에서만 고릅니다.
            </p>
          </div>
        </main>
      </div>
    </div>

    <script src="./classic-optimizer-core.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
